<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronically Rebranding</title>
<meta name="description" content="Chronically Rebranding. New site coming soon.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f7f6fb;--ink:#22203a;--muted:#5f5c74;--accent:#7b5cd6}
@media (prefers-color-scheme:dark){:root{--bg:#16151f;--ink:#efedf7;--muted:#a7a3bb;--accent:#a990f0;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;display:grid;place-items:center;padding:24px;text-align:center}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(34px,7vw,56px);margin:0 0 12px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
p{color:var(--muted);font-size:18px;margin:0}
</style>
</head>
<body>
<main>
<h1>Chronically <span>Rebranding</span></h1>
<p>New site coming soon.</p>
</main>
</body>
</html>
